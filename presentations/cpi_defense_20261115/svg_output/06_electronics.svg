<g id="protocol" data-pptx-bounds="56 485 560 163"><text x="56" y="519" fill="#12304A" font-size="30" font-weight="bold">USB CDC承载V1协议</text><text x="56" y="566" fill="#203447">长度、序号、单位、CRC16与心跳<tspan x="56" dy="43">树莓派规划目标，C板回传执行状态</tspan></text><text x="56" y="638" fill="#596D7E" font-size="18">USB-A → MicroUSB；USART1保留CRSF</text></g>
<g id="safety" data-pptx-bounds="675 485 549 163"><text x="675" y="519" fill="#12304A" font-size="30" font-weight="bold">一个入口，明确控制权</text><text x="675" y="566" fill="#203447">手动优先，统一仲裁自主控制目标<tspan x="675" dy="43">通信超时 / 目标失效 → 停止自主运动</tspan></text><text x="675" y="638" fill="#596D7E" font-size="18">错误帧不得更新目标，避免多线程抢写</text></g>
