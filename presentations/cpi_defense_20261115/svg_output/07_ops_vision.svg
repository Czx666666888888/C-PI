<g id="header" data-pptx-bounds="56 28 1168 105" fill="#12304A"><text x="56" y="51" font-size="18" fill="#008C95">06 / 当前重点 · 定位与视觉优化</text><text x="56" y="109" font-size="40" font-weight="bold">OPS管全场，视觉修正工位偏差</text></g>
<g id="ops-track" data-pptx-bounds="56 162 550 413"><text x="56" y="202" fill="#12304A" font-size="30" font-weight="bold">OPS / 建立全场位姿</text><image href="../images/mechanism_5.jpg" x="56" y="220" width="300" height="225" preserveAspectRatio="xMidYMid meet"/><image href="../images/mechanism_3.jpg" x="371" y="245" width="235" height="180" preserveAspectRatio="xMidYMid meet"/><text x="56" y="485" fill="#203447">轮组位移 + 姿态 → 位姿估计 → 路线跟踪</text><text x="56" y="529" fill="#596D7E" font-size="18">接地、尺度、方向符号与坐标对齐标定<tspan x="56" dy="35">直线、横移、转向与闭合路线误差验证</tspan></text></g>
<g id="vision-track" data-pptx-bounds="665 162 559 413"><text x="665" y="202" fill="#12304A" font-size="30" font-weight="bold">视觉 / 提高工位作业稳定性</text><rect x="665" y="235" width="559" height="100" fill="#F1F5F9"/><text x="689" y="275" fill="#203447">采图 → 分割与识别 → 中心估计</text><text x="689" y="314" fill="#008C95">有效性判断 → 颜色、偏差与valid输出</text><text x="665" y="383" fill="#203447">OpenCV：二维码、颜色、物料中心<tspan x="665" dy="46">dx = cx − 290　dy = 260 − cy</tspan></text><text x="665" y="485" fill="#596D7E" font-size="18">当前实验：圆台上表面中心稳定性</text><text x="665" y="529" fill="#596D7E" font-size="18">固定相机姿态、减少反光、多位置光照样本<tspan x="665" dy="35">先评估准确性与有效率，再考虑滤波</tspan></text></g>
<g id="fusion-message" data-pptx-bounds="56 596 1168 64"><rect x="56" y="596" width="1168" height="64" fill="#12304A"/><text x="80" y="637" fill="#FFFFFF">全场定位到达工位附近 → 视觉确认有效目标 → 局部矫正与抓放；目标无效时停止。</text></g>
<g id="footer" data-pptx-bounds="56 675 1168 28" fill="#596D7E" font-size="14"><text x="56" y="695">配图为定位轮结构，非OPS电路板。上表面中心实验尚未达标；全场与视觉绝对精度 UNVERIFIED。</text><text x="1220" y="695" text-anchor="end">07</text></g>
